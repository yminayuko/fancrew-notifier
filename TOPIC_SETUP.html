<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone通知の設定</title><style>body{font:17px sans-serif;max-width:640px;padding:24px;margin:auto;line-height:1.7}input{box-sizing:border-box;width:100%;font:16px monospace;padding:12px}button{font:17px sans-serif;padding:12px;margin:10px 0}small{display:block}</style><h1>ファンくる通知の設定</h1><p>専用トピック名を生成し、GitHubのSecret「NTFY_TOPIC」と、iPhoneのntfyアプリの両方に同じ名前を登録してください。ntfyのサーバーは https://ntfy.sh です。</p><input id="topic" readonly aria-label="通知トピック"><button id="generate">新しいトピック名を生成</button><button id="copy">コピー</button><p id="status" role="status"></p><small>生成はこのブラウザ内で行います。生成した名前は他人に共有しないでください。既に設定済みなら、前のトピック名を引き続き使ってください。この画面を閉じると生成した名前は失われます。</small><script>
const topic=document.getElementById('topic'),status=document.getElementById('status');
document.getElementById('generate').onclick=()=>{const data=new Uint8Array(16);crypto.getRandomValues(data);topic.value='fancrew-'+Array.from(data,b=>b.toString(16).padStart(2,'0')).join('');status.textContent='生成しました。両方へ登録するまでこの画面を閉じないでください。';};
document.getElementById('copy').onclick=async()=>{if(!topic.value)return;try{await navigator.clipboard.writeText(topic.value);status.textContent='コピーしました。';}catch(e){topic.select();status.textContent='文字列を長押ししてコピーしてください。';}};
</script></html>
